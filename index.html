<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EF GAMES</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Courier New",monospace}
canvas{position:fixed;inset:0;z-index:0;opacity:.22}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(255,255,255,.035) 4px)}
.wrap{position:relative;z-index:2;width:min(1100px,92vw);height:100vh;margin:auto;padding:42px 0}
header{text-align:center;border:1px solid #fff;padding:25px;margin-bottom:25px;background:rgba(0,0,0,.82);box-shadow:0 0 25px #fff2}
.logo{font-size:clamp(42px,8vw,86px);font-weight:900;letter-spacing:12px;animation:flicker 2.5s infinite}
.sub{margin-top:8px;font-size:12px;letter-spacing:5px;color:#aaa}
@keyframes flicker{0%,18%,22%,63%,64%,66%,100%{opacity:1}20%,65%{opacity:.35}}
.status{border:1px solid #777;padding:10px;margin-bottom:18px;background:#050505;display:flex;justify-content:space-between;font-size:12px;color:#ccc}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{border:1px solid #aaa;background:rgba(0,0,0,.86);padding:18px;min-height:145px;transition:.15s}
.card:hover{border-color:#fff;box-shadow:0 0 18px #fff4;transform:translateY(-2px)}
.card h2{margin:0 0 12px;font-size:18px;text-transform:uppercase;letter-spacing:3px}
.card button{width:100%;padding:12px;background:#fff;color:#000;border:0;font-family:inherit;font-weight:bold;cursor:pointer}
.card button:hover{background:#bbb}
.empty{color:#777;font-size:12px;margin:12px 0 18px}
footer{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#666;font-size:11px;z-index:3}
#modal{display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:25px}
.box{width:min(700px,95vw);max-height:80vh;overflow:auto;border:1px solid #fff;background:#050505;padding:25px}
.box h2{margin-top:0;letter-spacing:4px}
.url{display:block;color:#fff;padding:12px 0;border-bottom:1px dashed #555;word-break:break-all}
.close{margin-top:20px;padding:10px 18px;background:#fff;border:0;font-family:inherit;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<canvas id="code"></canvas><div class="scan"></div>
<div class="wrap">
<header>
<div class="logo">EF GAMES</div>
<div class="sub">&quot;giving you games since 25&quot;</div>
</header>

<div class="grid">
<section class="card"><h2>FERN</h2><button onclick="openBox('FERN')">OPEN</button></section>

<section class="card"><h2>GN-MATH</h2><button onclick="openBox('GN-MATH')">OPEN</button></section>
<section class="card"><h2>YUKIOS</h2><button onclick="openBox('YUKIOS')">OPEN</button></section>
</div>
</div>
<footer>EF GAMES // SYSTEM READY</footer>
<div id="modal"><div class="box"><h2 id="title"></h2><div id="urls"></div><button class="close" onclick="closeBox()">CLOSE</button></div></div>
